spring.application.name=BankTransferService
server.port=8080

# Activate dev profile by default
spring.profiles.active=dev

logging.level.root=INFO

# Springdoc OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Redis idempotency cache TTL (seconds). Replay source of truth is MySQL; this does not delete SUCCESS rows.
app.idempotency.ttl-seconds=86400
app.transfer.cooldown-seconds=10

