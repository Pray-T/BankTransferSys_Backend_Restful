# Local MySQL/Redis integration tests (no Docker/Testcontainers).
# Uses a dedicated DB so create-drop does not wipe the main schema.
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:bank_transfer_test}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=utf8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:1}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Keep idempotency records long enough for replay assertions
app.idempotency.ttl-seconds=60

# Default cooldown; concurrency tests override to 0 via @TestPropertySource
app.transfer.cooldown-seconds=10

logging.level.root=WARN
logging.level.com.banktransfer=INFO
