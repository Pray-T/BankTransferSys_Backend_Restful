# Local MySQL/Redis integration tests (no Docker/Testcontainers).
# Schema comes only from TEST_DB_NAME. The app DB_NAME variable is not read,
# so a shell that exported the dev schema cannot make create-drop wipe it.
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${TEST_DB_NAME:bank_transfer_test}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=utf8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
# Index comes only from TEST_REDIS_DATABASE so the app REDIS_DATABASE=0 is not reused.
spring.data.redis.database=${TEST_REDIS_DATABASE:1}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Redis cache TTL only. Replay is read from MySQL and does not depend on this value.
app.idempotency.ttl-seconds=60

# Default cooldown; concurrency tests override to 0 via @TestPropertySource
app.transfer.cooldown-seconds=10

logging.level.root=WARN
logging.level.com.banktransfer=INFO
